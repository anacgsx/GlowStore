databases:
  - name: glowstore-db
    plan: free
    databaseName: glowstore
    user: glowstore

services:
  - type: web
    name: glowstore
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn glowstore.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DEBUG
        value: "False"

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: glowstore-db
          property: connectionString

      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"

      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"

      - key: SERVE_MEDIA
        value: "False"

      - key: MEDIA_AS_STATIC
        value: "True"